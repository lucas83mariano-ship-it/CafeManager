name: API Tests

on:
  push:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafemanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafemanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar banco de dados
        run: |
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/cafemanager" > .env

      - name: Criar tabelas do banco
        run: |
          python -c "from app.database import engine; from app.models import Base; Base.metadata.create_all(bind=engine)"

      - name: Criar usuário Admin
        run: python criar_admin.py

      - name: Iniciar API
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Instalar Newman
        run: npm install -g newman

      - name: Executar testes da API
        run: |
          newman run "postman/Projeto_Café.postman_collection.json" \
          -e "postman/CafeManager CI.postman_environment.json"