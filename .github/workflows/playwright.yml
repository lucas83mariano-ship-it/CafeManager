name: FrontEnd Tests

on:
  push:
    branches:
      - main
      - develop

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafemanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafemanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CafeManagerWeb/package-lock.json

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar banco de dados
        run: |
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/cafemanager" > .env

      - name: Criar tabelas do banco
        run: |
          python -c "from app.database import engine; from app.models import Base; Base.metadata.create_all(bind=engine)"

      - name: Criar usuário Admin
        run: python criar_admin.py

      - name: Instalar dependências do FrontEnd
        working-directory: CafeManagerWeb
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: CafeManagerWeb
        run: npx playwright install --with-deps chromium

      - name: Iniciar API
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/docs > /dev/null; then
              echo "API disponível."
              exit 0
            fi
            sleep 2
          done

          echo "A API não iniciou a tempo."
          cat api.log
          exit 1

      - name: Iniciar FrontEnd
        working-directory: CafeManagerWeb
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --host 0.0.0.0 > vite.log 2>&1 &

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend disponível."
              exit 0
            fi
            sleep 2
          done

          echo "O frontend não iniciou a tempo."
          cat vite.log
          exit 1

      - name: Executar testes do Playwright
        working-directory: CafeManagerWeb
        run: npx playwright test

      - name: Disponibilizar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: CafeManagerWeb/playwright-report/
          if-no-files-found: ignore
          retention-days: 7